name: CryptoStream Ingestion

on:
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show collector source
        run: |
          echo "===== COLLECTOR SOURCE ====="
          sed -n '1,120p' collector/crypto_collector.py
          echo "===== GIT COMMIT ====="
          git log -1 --oneline

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r collector/requirements.txt

      - name: Start crypto collector
        run: |
          python collector/crypto_collector.py