name: CryptoStream Ingestion

on:
  workflow_dispatch:

  schedule:
    - cron: "*/2 * * * *"

jobs:
  ingest:
    runs-on: ubuntu-latest

    timeout-minutes: 5

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install websocket-client databricks-sdk

      # --------------------------------------------------
      # Collect trades from Coinbase
      # --------------------------------------------------

      - name: Collect Coinbase trades
        run: |
          timeout 60 python -u collector/crypto_collector.py || true

      # --------------------------------------------------
      # Show files generated by collector
      # --------------------------------------------------

      - name: List collected files
        run: |
          echo "Collected NDJSON files:"
          ls -lh *.ndjson || true

      # --------------------------------------------------
      # Upload every NDJSON batch to Databricks
      # --------------------------------------------------

      - name: Upload all NDJSON files
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import glob

          from databricks.sdk import WorkspaceClient

          w = WorkspaceClient(
              host=os.environ["DATABRICKS_HOST"],
              token=os.environ["DATABRICKS_TOKEN"],
          )

          files = sorted(glob.glob("*.ndjson"))

          print(f"Found {len(files)} NDJSON files.")

          if not files:
              raise RuntimeError(
                  "No NDJSON files were produced."
              )

          for filename in files:

              target = (
                  "/Volumes/workspace/default/"
                  f"crypto_raw/{os.path.basename(filename)}"
              )

              print("")
              print(f"Uploading: {filename}")
              print(f"Target:    {target}")

              with open(filename, "rb") as f:
                  w.files.upload(
                      target,
                      f,
                      overwrite=True,
                  )

              print("Upload successful.")

          print("")
          print("All NDJSON files uploaded successfully.")
          PY

      # --------------------------------------------------
      # Trigger Databricks Pipeline
      # --------------------------------------------------

      - name: Trigger Databricks Pipeline
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

          # IMPORTANT:
          # Replace YOUR_JOB_ID with the actual
          # Databricks Job ID for:
          # CryptoStream Pipeline
          DATABRICKS_JOB_ID: "5832953800225"

        run: |
          python - <<'PY'
          import os

          from databricks.sdk import WorkspaceClient

          w = WorkspaceClient(
              host=os.environ["DATABRICKS_HOST"],
              token=os.environ["DATABRICKS_TOKEN"],
          )

          job_id = int(
              os.environ["DATABRICKS_JOB_ID"]
          )

          print(
              f"Triggering Databricks Job: {job_id}"
          )

          run = w.jobs.run_now(
              job_id=job_id
          )

          print(
              f"Started Databricks run: {run.run_id}"
          )

          print(
              "Databricks pipeline triggered successfully."
          )
          PY